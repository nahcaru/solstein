<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cursorBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cursorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg14)" stroke="#1E293B" stroke-width="2"/>

  <!-- Refracted Twin Ghost -->
  <g transform="translate(18, 22)" opacity="0.5">
    <path d="M 180 120 L 260 270 L 225 275 L 305 385 L 275 395 L 195 285 L 160 290 Z" 
          fill="none" stroke="url(#ghostGrad)" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Refraction connect rays -->
  <line x1="180" y1="120" x2="198" y2="142" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="305" y1="385" x2="323" y2="407" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Main Sól Cursor Pointer -->
  <!-- Cursor top arrowhead that steps down into the ᛋ zigzag -->
  <g filter="url(#cursorShadow)">
    <path d="M 170 110 L 265 260 L 225 268 L 315 385 L 280 398 L 190 280 L 150 288 Z" 
          fill="url(#cursorBody)" stroke="#F8FAFC" stroke-width="6" stroke-linejoin="round"/>
    <!-- Subtle inner neon rune cut -->
    <path d="M 185 145 L 245 240 L 210 252 L 275 365" 
          fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>