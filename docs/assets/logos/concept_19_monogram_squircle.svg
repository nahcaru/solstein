<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg19" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#263147"/>
      <stop offset="100%" stop-color="#0E131F"/>
    </linearGradient>
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sol3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow19" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tileBg19)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ambient Underglow -->
  <path d="M 195 130 L 320 220 L 195 292 L 320 382" 
        fill="none" stroke="#F59E0B" stroke-width="50" 
        stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#innerGlow)"/>

  <!-- Extruded 3D ᛋ Glyph -->
  <!-- Lower drop shadow extrusion -->
  <path d="M 195 142 L 320 232 L 195 304 L 320 394" 
        fill="none" stroke="#78350F" stroke-width="32" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow19)"/>
  
  <!-- Main 3D Sól Bar -->
  <path d="M 195 130 L 320 220 L 195 292 L 320 382" 
        fill="none" stroke="url(#sol3D)" stroke-width="32" 
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Beveled Highlight Ridge -->
  <path d="M 195 130 L 320 220 L 195 292 L 320 382" 
        fill="none" stroke="#FEF3C7" stroke-width="8" 
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>