<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="fissureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg16)" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Calcite Facet Block -->
  <path d="M 130 140 L 250 140 L 180 230 L 260 310 L 170 372 L 130 372 Z" 
        fill="url(#facetLeft)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Right Calcite Facet Block -->
  <path d="M 382 140 L 275 140 L 205 230 L 285 310 L 195 372 L 382 372 Z" 
        fill="url(#facetRight)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"
        transform="translate(18, 0)"/>

  <!-- Radiant Fissure Forming ᛋ in Negative Space -->
  <path d="M 262 140 L 192 230 L 272 310 L 182 372" 
        fill="none" stroke="#FBBF24" stroke-width="16" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#fissureGlow)"/>
  <path d="M 262 140 L 192 230 L 272 310 L 182 372" 
        fill="none" stroke="#FFFFFF" stroke-width="5" 
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>