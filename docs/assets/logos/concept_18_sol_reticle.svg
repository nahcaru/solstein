<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg18" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#07090E"/>
    </radialGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg18)" stroke="#1E293B" stroke-width="2"/>

  <!-- Instrument Dial Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>

  <!-- Degree Tick Marks -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.6">
    <line x1="256" y1="86" x2="256" y2="100"/>
    <line x1="256" y1="412" x2="256" y2="426"/>
    <line x1="86" y1="256" x2="100" y2="256"/>
    <line x1="412" y1="256" x2="426" y2="256"/>
    <line x1="136" y1="136" x2="146" y2="146"/>
    <line x1="376" y1="136" x2="366" y2="146"/>
    <line x1="136" y1="376" x2="146" y2="366"/>
    <line x1="376" y1="376" x2="366" y2="366"/>
  </g>

  <!-- Central Azimuth Needle Shaped as ᛋ -->
  <path d="M 210 160 L 302 225 L 210 287 L 302 352" 
        fill="none" stroke="url(#brassGold)" stroke-width="14" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#dialGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/>
</svg>