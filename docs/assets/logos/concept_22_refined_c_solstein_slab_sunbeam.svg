<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Rising Sun Gradient -->
    <radialGradient id="sunGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Slab Glass Gradient -->
    <linearGradient id="slabGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Sól Sunbeam Path Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="sunBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bgC)" stroke="#1E293B" stroke-width="2"/>

  <!-- Arctic Sea Fog Horizon Layer -->
  <path d="M 60 170 C 140 160 200 180 256 170 C 312 160 380 180 452 170 L 452 230 L 60 230 Z" 
        fill="#334155" fill-opacity="0.2"/>

  <!-- Rising Sun Behind the Glass Horizon -->
  <circle cx="256" cy="155" r="90" fill="url(#sunGlowC)" filter="url(#sunBloom)" opacity="0.85"/>
  <circle cx="256" cy="155" r="32" fill="#FFFBEB" filter="url(#sunBloom)"/>

  <!-- Floating Solstein Phone Slab (Perspective view) -->
  <!-- Top: (140, 160) to (372, 160), Bottom: (120, 420) to (392, 420) -->
  <polygon points="150,170 362,170 392,420 120,420" 
           fill="url(#slabGlass)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Top Glass Horizon Bevel Line (Catching Solar Dawn Light) -->
  <line x1="150" y1="170" x2="362" y2="170" stroke="#FDE68A" stroke-width="3" opacity="0.9"/>
  
  <!-- Subtle Trackpad Capacitive Grid on the Phone Slab -->
  <g stroke="#94A3B8" stroke-width="1" opacity="0.12" stroke-dasharray="3 6">
    <line x1="180" y1="210" x2="340" y2="210"/>
    <line x1="160" y1="280" x2="355" y2="280"/>
    <line x1="140" y1="350" x2="375" y2="350"/>
  </g>

  <!-- The Sól Polarized Sunbeam: 3-stroke Younger Futhark 'ᛋ' cutting down the glass -->
  <!-- Top stroke: starts at top-right (290, 190) -> angles down-left to (210, 260) -->
  <!-- Middle stroke: angles down-right to (290, 320) -->
  <!-- Bottom stroke: angles down-left to (230, 385) [The Pointer Target] -->
  <path d="M 290 190 L 210 260 L 290 320 L 230 385" 
        fill="none" stroke="#F59E0B" stroke-width="22" 
        stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#sunBloom)"/>
  <path d="M 290 190 L 210 260 L 290 320 L 230 385" 
        fill="none" stroke="url(#beamGrad)" stroke-width="9" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#sunBloom)"/>
  <path d="M 290 190 L 210 260 L 290 320 L 230 385" 
        fill="none" stroke="#FFFFFF" stroke-width="3" 
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor Pointer Dot & Capacitive Ripple at termination point -->
  <circle cx="230" cy="385" r="28" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="230" cy="385" r="14" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.75"/>
  <circle cx="230" cy="385" r="6" fill="#FFFFFF"/>
</svg>