<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="wireSol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow17" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg17)" stroke="#1E293B" stroke-width="2"/>

  <!-- Phone Outline (Left, vertical trackpad device) -->
  <rect x="110" y="150" width="120" height="212" rx="20" 
        fill="#111827" fill-opacity="0.8" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="170" cy="170" r="4" fill="#38BDF8" opacity="0.6"/>

  <!-- Computer Screen Outline (Right, widescreen display) -->
  <rect x="230" y="170" width="172" height="130" rx="14" 
        fill="#1F2937" fill-opacity="0.5" stroke="#94A3B8" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M 290 300 L 342 300 L 350 330 L 282 330 Z" fill="#334155" opacity="0.4"/>

  <!-- The Sól Rune Bridge between Phone & Computer -->
  <!-- Originates on phone screen (170, 210), cuts diagonally to screen edge (260, 270), steps down-left (200, 310), exits right (310, 350) -->
  <path d="M 170 210 L 280 230 L 195 285 L 315 305" 
        fill="none" stroke="url(#wireSol)" stroke-width="12" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow17)"/>
  <circle cx="170" cy="210" r="6" fill="#38BDF8"/>
  <circle cx="315" cy="305" r="6" fill="#FBBF24"/>
</svg>