<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg13" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151C2C"/>
      <stop offset="100%" stop-color="#080C14"/>
    </radialGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow13" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg13)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle trackpad dot grid -->
  <g opacity="0.12" fill="#94A3B8">
    <circle cx="160" cy="160" r="2"/><circle cx="256" cy="160" r="2"/><circle cx="352" cy="160" r="2"/>
    <circle cx="160" cy="256" r="2"/><circle cx="256" cy="256" r="2"/><circle cx="352" cy="256" r="2"/>
    <circle cx="160" cy="352" r="2"/><circle cx="256" cy="352" r="2"/><circle cx="352" cy="352" r="2"/>
  </g>

  <!-- Ripple rings at contact point -->
  <circle cx="180" cy="140" r="48" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.2"/>
  <circle cx="180" cy="140" r="28" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  <circle cx="180" cy="140" r="14" fill="#F59E0B" opacity="0.25"/>

  <!-- Sól Rune Gesture Swipe Trail -->
  <!-- Stroke: (180, 140) -> (332, 220) -> (180, 292) -> (332, 372) -->
  <path d="M 180 140 L 332 220 L 180 292 L 332 372" 
        fill="none" stroke="url(#trailGrad)" stroke-width="28" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow13)"/>
  
  <!-- Inner precise vector line -->
  <path d="M 180 140 L 332 220 L 180 292 L 332 372" 
        fill="none" stroke="#FFFFFF" stroke-width="6" 
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Finger contact core -->
  <circle cx="180" cy="140" r="7" fill="#FFFFFF"/>
</svg>