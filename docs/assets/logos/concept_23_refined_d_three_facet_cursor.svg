<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgD" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="60%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <!-- Facet Gradients for 3-Facet Architecture -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="facet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Sól Seam Glow -->
    <linearGradient id="seamSol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="shadowD" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="seamGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bgD)" stroke="#1E293B" stroke-width="2"/>

  <!-- Offset Birefringent Ghost Cursor Shadow -->
  <g transform="translate(30, 34)" opacity="0.45">
    <path d="M 160 110 L 160 335 L 215 285 L 270 385 L 305 365 L 250 268 L 315 268 Z" 
          fill="#0284C7" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- 3-Facet Crystal Cursor -->
  <g filter="url(#shadowD)">
    <!-- Facet 1: Top Wing (Left of Sól Top-Stroke) -->
    <path d="M 160 110 L 245 175 L 195 225 L 160 225 Z" 
          fill="url(#facet1)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Facet 2: Body / Right Wing -->
    <path d="M 160 110 L 315 268 L 245 268 L 195 225 L 245 175 Z" 
          fill="url(#facet2)" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Facet 3: Lower Tail & Stem -->
    <path d="M 160 225 L 195 225 L 245 268 L 205 320 L 270 385 L 305 365 L 250 268 L 160 335 Z" 
          fill="url(#facet3)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Outer Cursor Precision Calcite Border -->
    <path d="M 160 110 L 160 335 L 215 285 L 270 385 L 305 365 L 250 268 L 315 268 Z" 
          fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linejoin="round"/>

    <!-- SEAM RIDGE: The 3-stroke Younger Futhark Sól 'ᛋ' formed by the facet intersections -->
    <!-- (245, 175) -> down-left (195, 225) -> down-right (245, 268) -> down-left (205, 320) -->
    <path d="M 245 175 L 195 225 L 245 268 L 205 320" 
          fill="none" stroke="#F59E0B" stroke-width="14" 
          stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#seamGlow)"/>
    <path d="M 245 175 L 195 225 L 245 268 L 205 320" 
          fill="none" stroke="url(#seamSol)" stroke-width="6" 
          stroke-linecap="round" stroke-linejoin="round" filter="url(#seamGlow)"/>
    <path d="M 245 175 L 195 225 L 245 268 L 205 320" 
          fill="none" stroke="#FFFFFF" stroke-width="2" 
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cyan specular edge reflection on the cursor spine -->
  <line x1="160" y1="110" x2="160" y2="335" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
</svg>